name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

env:
  FLUTTER_VERSION: "3.22.0"
  JAVA_VERSION: "17"

jobs:
  # ---------------------------------------------------------------------
  # Static analysis, codegen (Isar's *.g.dart part files), and unit tests.
  # Runs first and gates the build jobs below — no point spending Android/
  # iOS build minutes on a change that doesn't even analyze cleanly.
  # ---------------------------------------------------------------------
  analyze_and_test:
    name: Analyze, codegen & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Isar code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 14

  # ---------------------------------------------------------------------
  # Android debug + release APK. Release uses debug signing (see
  # app/build.gradle's comment on signingConfigs.debug) until a real
  # release keystore is added as a repository secret — this job builds
  # successfully either way, it just doesn't produce a Play-Store-
  # uploadable artifact until that's configured.
  # ---------------------------------------------------------------------
  build_android:
    name: Build Android
    needs: analyze_and_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Isar code generation
        run: dart run build_runner build --delete-conflicting-outputs

      # Optional release signing — only activates if these three secrets
      # are configured in the repository; otherwise the debug-signed build
      # below proceeds unaffected. See android/app/build.gradle.
      - name: Decode release keystore (if configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: flutter build apk --release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # ---------------------------------------------------------------------
  # iOS build verification only (--no-codesign) — this confirms the
  # Flutter/Xcode build graph compiles on every change without requiring
  # an Apple Developer signing identity in CI secrets. Producing an
  # actual installable/TestFlight-uploadable .ipa needs real signing
  # credentials (a distribution certificate + provisioning profile),
  # which is a deliberate separate step once those exist — added here as
  # a commented job template rather than a job that would fail with a
  # confusing signing error on every run until secrets are configured.
  # ---------------------------------------------------------------------
  build_ios:
    name: Build iOS (unsigned)
    needs: analyze_and_test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Isar code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Build (no codesign)
        run: flutter build ios --release --no-codesign

      # --- Real TestFlight/App Store upload, once signing is configured ---
      # Requires these repository secrets: IOS_DIST_CERTIFICATE_BASE64,
      # IOS_DIST_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64,
      # APP_STORE_CONNECT_API_KEY (and its issuer ID / key ID). Uncomment
      # and fill in once those exist — left commented rather than active-
      # but-failing so this workflow passes cleanly before that setup work
      # is done, consistent with the Android job's optional-signing note.
      #
      # - name: Import signing certificate
      #   uses: apple-actions/import-codesign-certs@v3
      #   with:
      #     p12-file-base64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
      #     p12-password: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
      # - name: Build signed archive
      #   run: |
      #     flutter build ipa --release \
      #       --export-options-plist=ios/ExportOptions.plist
      # - name: Upload to TestFlight
      #   uses: apple-actions/upload-testflight-build@v1
      #   with:
      #     app-path: build/ios/ipa/*.ipa
      #     api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      #     api-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      #     api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
