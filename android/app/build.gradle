plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '0.1.0'

// Release signing: reads from a keystore path + credentials, sourced
// either from a local key.properties file (for a developer's own machine)
// or from environment variables (for CI — see .github/workflows/ci.yml's
// "Decode release keystore" step, which writes the keystore file this
// looks for and sets these same env var names). If neither source
// provides a real keystore, this falls back to debug signing so a plain
// `flutter build apk --release` still succeeds without any of this setup
// — the fallback is silent by design for local development, but CI's
// build_android job logs which path was taken.
def keystorePropertiesFile = rootProject.file('key.properties')
def keystoreProperties = new Properties()
def hasLocalKeystoreConfig = keystorePropertiesFile.exists()
if (hasLocalKeystoreConfig) {
    keystorePropertiesFile.withReader('UTF-8') { reader -> keystoreProperties.load(reader) }
}

def releaseKeystorePath = hasLocalKeystoreConfig
    ? keystoreProperties['storeFile']
    : (System.getenv('ANDROID_KEYSTORE_PASSWORD') != null ? 'release.keystore' : null)
def releaseKeystorePassword = hasLocalKeystoreConfig
    ? keystoreProperties['storePassword']
    : System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = hasLocalKeystoreConfig
    ? keystoreProperties['keyAlias']
    : System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = hasLocalKeystoreConfig
    ? keystoreProperties['keyPassword']
    : System.getenv('ANDROID_KEYSTORE_PASSWORD') // CI supplies one password used for both, as generated by keytool with matching store/key passwords
def hasReleaseSigningConfig = releaseKeystorePath != null &&
    file(releaseKeystorePath.toString()).exists() &&
    releaseKeystorePassword != null

android {
    namespace "com.craunch.player"
    compileSdk 34
    ndkVersion "26.1.10909125"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Isar and several audio native libs still ship pre-desugared
        // Java 8 bytecode dependencies; core library desugaring keeps
        // those usable on API < 26 devices without raising minSdk.
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.craunch.player"
        // audio_service + isar both require 21 at minimum; on_audio_query's
        // Android 13 media-permission split is handled at 33+ via the
        // manifest's READ_MEDIA_AUDIO/VIDEO entries, not by raising minSdk.
        minSdkVersion 23
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true

        // MP3 encoder native build — commented out by default so the
        // project builds successfully out of the box (`flutter build apk`)
        // before libmp3lame is vendored. Uncomment once you've followed
        // the setup steps in cpp/CMakeLists.txt and cpp/lame_jni.cpp;
        // until then, DemuxPlugin.kt's MP3-transcode path returns a clear
        // "native encoder not built" error at runtime instead, so the
        // instant-demux (.m4a) path keeps working either way.
        // externalNativeBuild {
        //     cmake {
        //         cppFlags "-std=c++17"
        //         abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        //     }
        // }
    }

    // externalNativeBuild {
    //     cmake {
    //         path "src/main/cpp/CMakeLists.txt"
    //         version "3.22.1"
    //     }
    // }

    packagingOptions {
        // isar_flutter_libs and multiple audio codec native libraries can
        // ship duplicate architecture-specific .so files across transitive
        // dependencies; pickFirst avoids a build failure on the merge step
        // rather than silently corrupting one binary with another's bytes.
        jniLibs {
            pickFirsts += ['**/libc++_shared.so', '**/libisar.so']
        }
    }

    signingConfigs {
        if (hasReleaseSigningConfig) {
            release {
                storeFile file(releaseKeystorePath.toString())
                storePassword releaseKeystorePassword.toString()
                keyAlias releaseKeyAlias.toString()
                keyPassword releaseKeyPassword.toString()
            }
        }
    }

    buildTypes {
        release {
            // Real release signing when a keystore is actually present
            // (local key.properties or CI's decoded secret); otherwise
            // debug signing, so `flutter build apk --release` still
            // succeeds out of the box during development. See the
            // hasReleaseSigningConfig computation above this block.
            signingConfig hasReleaseSigningConfig ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'androidx.multidex:multidex:2.0.1'
    // android.media.audiofx.Equalizer/BassBoost/Virtualizer/PresetReverb
    // used by the 10-band equalizer module are part of the Android SDK
    // itself (android.media.audiofx.*), so no extra AAR dependency is
    // needed for that feature beyond the platform SDK already on compile
    // classpath via compileSdk above.
}
