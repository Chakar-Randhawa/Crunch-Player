buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
subprojects {
    ext.pluginHooks = {
        if (project.hasProperty("android")) {
            // Fix for isar_flutter_libs missing namespace
            if (project.name == "isar_flutter_libs" || project.android.namespace == null) {
                project.android.namespace = "dev.isar.isar_flutter_libs"
            }
            
            // Fix for on_audio_query manifest package conflict
            if (project.name.contains("on_audio_query")) {
                project.android.namespace = "com.lucasjosino.on_audio_query"
                project.android.aaptOptions.namespaced = false
            }
        }
        
        // Final Fix: Bypasses the strict JVM Target validation crash for all plugins
        if (project.plugins.hasPlugin("org.jetbrains.kotlin.android")) {
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile.class).configureEach {
                compilerOptions {
                    // Suppresses the inconsistent 1.8 vs 17 target crash completely
                    jvmTargetValidationMode = org.jetbrains.kotlin.gradle.dsl.JvmTargetValidationMode.IGNORE
                }
            }
        }
    }
    if (project.state.executed) {
        pluginHooks()
    } else {
        project.afterEvaluate {
            pluginHooks()
        }
    }
}
